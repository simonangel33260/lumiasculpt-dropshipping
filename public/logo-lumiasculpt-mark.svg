<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="512" height="512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="8" y1="6" x2="56" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#271B1E"/>
      <stop offset="55%" stop-color="#181214"/>
      <stop offset="100%" stop-color="#110D0E"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="12" y1="10" x2="52" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F7E4C4"/>
      <stop offset="48%" stop-color="#DFB885"/>
      <stop offset="100%" stop-color="#B88754"/>
    </linearGradient>
    <linearGradient id="roseSpark" x1="39" y1="13" x2="49" y2="25" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFE6EB"/>
      <stop offset="55%" stop-color="#F29BAA"/>
      <stop offset="100%" stop-color="#C8465A"/>
    </linearGradient>
  </defs>

  <!-- Obsidian-Espresso Couture Medallion -->
  <circle cx="32" cy="32" r="31" fill="url(#bgGrad)"/>

  <!-- Fine Double Champagne-Gold Hairline Border -->
  <circle cx="32" cy="32" r="28.6" stroke="url(#goldGrad)" stroke-width="0.95" stroke-opacity="0.85"/>
  <circle cx="32" cy="32" r="25.8" stroke="url(#goldGrad)" stroke-width="0.45" stroke-opacity="0.34"/>

  <!-- Sculpted Architectural "L" (Didone Serif Stem + Graceful Foot) -->
  <path
    d="M20.5 18.5 V43.2 C20.5 44.8 21.4 45.6 23.2 45.6 H35.2 C37.2 45.6 38.6 44.7 39.4 42.9"
    stroke="url(#goldGrad)"
    stroke-width="2.15"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- Delicate Top Serif Accent on L -->
  <path
    d="M17.8 18.5 H23.2"
    stroke="url(#goldGrad)"
    stroke-width="1.35"
    stroke-linecap="round"
  />

  <!-- Flowing Sculpted Facial-Contour "S" Ribbon Intertwined on Right -->
  <path
    d="M42.8 28.4 C42.6 25.4 39.8 23.7 36.2 23.9 C32.3 24.1 29.8 26.3 29.9 29.1 C30.0 32.1 33.1 33.3 36.8 34.4 C40.6 35.5 43.4 37.0 43.2 40.4 C43.0 43.8 39.6 46.1 35.1 46.0"
    stroke="url(#goldGrad)"
    stroke-width="1.85"
    stroke-linecap="round"
  />

  <!-- Ascending Light-Sculpt Arc (Micro-Current Lift Curve) -->
  <path
    d="M25.6 40.6 C29.8 39.8 33.8 37.5 37.2 33.9"
    stroke="url(#goldGrad)"
    stroke-width="0.75"
    stroke-opacity="0.55"
    stroke-linecap="round"
  />

  <!-- 4-Point Parisian Radiance Star (Lumia LED Light) -->
  <path
    d="M44.2 13.8 C44.5 17.5 45.6 18.6 49.3 18.9 C45.6 19.2 44.5 20.3 44.2 24.0 C43.9 20.3 42.8 19.2 39.1 18.9 C42.8 18.6 43.9 17.5 44.2 13.8 Z"
    fill="url(#roseSpark)"
  />
</svg>
